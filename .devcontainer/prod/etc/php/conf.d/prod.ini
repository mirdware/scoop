display_errors = Off
display_startup_errors = Off
expose_php = Off
memory_limit = 128M
session.save_path = /tmp/php-sessions
upload_tmp_dir = /tmp
sys_temp_dir = /tmp
opcache.validate_timestamps = 0
curl.cainfo = /etc/ssl/certs/ca-certificates.crt
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
